spring.application.name=university-management-system

# PostgreSQL connection for running from IntelliJ: start the database first with  docker compose up -d db
# (inside Docker, compose.yaml overrides this URL to use the "db" container)
spring.datasource.url=jdbc:postgresql://localhost:5433/ums
spring.datasource.username=ums
spring.datasource.password=ums_secret

# Create/update tables automatically from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
