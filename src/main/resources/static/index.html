<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>University Management System</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Login -->
<section id="login-view" class="login-wrap" hidden>
    <form id="login-form" class="card login-card" autocomplete="on">
        <div class="brand">
            <img src="favicon.svg" alt="" width="36" height="36">
            <div>
                <h1>University Portal</h1>
                <p class="muted">Sign in to continue</p>
            </div>
        </div>
        <label>Username
            <input name="username" required autocomplete="username" autofocus>
        </label>
        <label>Password
            <input name="password" type="password" required autocomplete="current-password">
        </label>
        <p id="login-error" class="error" hidden></p>
        <button type="submit" class="btn primary block">Sign in</button>
        <details class="demo">
            <summary>Demo accounts</summary>
            <ul>
                <li><code>admin</code> / <code>admin123</code></li>
                <li><code>teacher</code> / <code>teacher123</code></li>
                <li><code>student</code> / <code>student123</code></li>
            </ul>
        </details>
    </form>
</section>

<!-- Dashboard -->
<section id="app-view" hidden>
    <header class="topbar">
        <div class="brand small">
            <img src="favicon.svg" alt="" width="26" height="26">
            <span>University Management System</span>
        </div>
        <div class="user">
            <span id="user-name"></span>
            <span id="user-role" class="badge"></span>
            <button id="logout-btn" class="btn ghost">Log out</button>
        </div>
    </header>

    <main class="container">
        <nav id="tabs" class="tabs"></nav>

        <div class="card">
            <div class="toolbar">
                <div>
                    <h2 id="resource-title"></h2>
                    <p id="resource-count" class="muted"></p>
                </div>
                <div class="toolbar-actions">
                    <input id="search" type="search" placeholder="Search…">
                    <button id="add-btn" class="btn primary">+ Add</button>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead id="table-head"></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
            <p id="empty" class="empty" hidden>No records found.</p>
        </div>
    </main>
</section>

<!-- Create / edit dialog -->
<dialog id="editor">
    <form id="editor-form" method="dialog">
        <h3 id="editor-title"></h3>
        <div id="editor-fields" class="grid"></div>
        <p id="editor-error" class="error" hidden></p>
        <div class="dialog-actions">
            <button type="button" class="btn ghost" id="editor-cancel">Cancel</button>
            <button type="submit" class="btn primary">Save</button>
        </div>
    </form>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
